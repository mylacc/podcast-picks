<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="cover.png">
<meta property="og:image" content="https://mylacc.github.io/podcast-picks/cover.png">
<link rel="alternate" type="application/rss+xml" title="{{TITLE}}" href="feed.xml">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1b; --muted: #66645e; --line: #e4e1d9;
    --card: #ffffff; --accent: #1f6f5c; --timely: #a3501b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --fg: #ecebe6; --muted: #a29f97; --line: #2f2e2a;
      --card: #1e1e1b; --accent: #6cc3a9; --timely: #e39a62;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .masthead { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .masthead img { width: 96px; height: 96px; border-radius: 14px; flex: none; }
  h1 { font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 20px; }
  .subscribe {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 28px;
  }
  .subscribe p { margin: 0 0 6px; }
  .subscribe code {
    display: block; overflow-wrap: anywhere; padding: 8px 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line); font-size: 0.92rem;
  }
  h2 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .pick { padding: 14px 0 18px; border-bottom: 1px solid var(--line); }
  .pick:last-child { border-bottom: 0; }
  .show { margin: 0; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
  .pick h3 { margin: 2px 0 8px; font-size: 1.12rem; line-height: 1.35; }
  .pick h3 a { color: inherit; text-decoration: none; }
  .pick h3 a:hover { text-decoration: underline; }
  .why { margin: 0 0 8px; }
  .meta { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .meta a { color: var(--accent); }
  .tag { white-space: nowrap; }
  .tag + .tag::before { content: "\00b7\00a0"; }
  .timely { color: var(--timely); font-weight: 600; }
  footer { margin-top: 40px; font-size: 0.85rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <img src="cover.png" alt="FI Podcast Picks cover art" width="120" height="120">
    <h1>{{TITLE}}</h1>
  </header>
  <p class="lede">{{DESCRIPTION}}</p>
  <div class="subscribe">
    <p><strong>Subscribe</strong> in any podcast app (AntennaPod, Pocket Casts, Overcast, Apple Podcasts) by adding this feed address:</p>
    <code>{{FEED_URL}}</code>
  </div>
{{PICKS}}
  <footer>
    Episodes play from each show's own audio file; nothing is re-hosted. Notes are summaries, not investment advice.
    Source on <a href="{{REPO_URL}}">GitHub</a>.
  </footer>
</main>
</body>
</html>
