name: Build and publish

on:
  push:
    paths:
      - picks.json
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    # 6:55am New York (EDT): picks up audio that reached a show's feed late
    - cron: "55 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml and index.html
        run: python3 scripts/build.py --out _site
      - name: Show resolved feed
        run: head -c 4000 _site/feed.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
