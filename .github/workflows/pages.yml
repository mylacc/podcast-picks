name: Build and publish

on:
  push:
    paths:
      - picks.json
      - scripts/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    # 6:55am New York (EDT): picks up audio that reached a show's feed late
    - cron: "55 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml and index.html
        run: python3 scripts/build.py --out _site
      - name: Show resolved feed
        run: head -c 4000 _site/feed.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live feed, page, cover, audio and show art
        run: |
          sleep 20
          base="https://mylacc.github.io/podcast-picks"
          curl -fsS "$base/feed.xml" -o feed.xml
          curl -fsS "$base/" -o index.html && grep -q "FI Podcast Picks" index.html
          curl -fsSI "$base/cover.png" | grep -i "content-type: image/png"
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          ch = ET.parse("feed.xml").getroot().find("channel")
          items = ch.findall("item")
          print("live feed items:", len(items))
          bad = 0
          for it in items:
              art = it.find("{http://www.itunes.com/dtds/podcast-1.0.dtd}image")
              checks = [("audio", it.find("enclosure").get("url"))]
              if art is not None:
                  checks.append(("art", art.get("href")))
              else:
                  print("::warning::no show art:", it.findtext("title"))
              for kind, url in checks:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "podcast-picks-verify/1.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          print(kind, r.status, r.headers.get("Content-Type"), it.findtext("title"))
                  except Exception as e:
                      bad += 1
                      print("::warning::%s check failed:" % kind, it.findtext("title"), e)
          assert items, "live feed has no items"
          print("failures:", bad)
          PY
